# Dependabot keeps dependencies and pinned GitHub Actions current. Updates are
# grouped (patch + minor together) and use Conventional Commit messages so they
# flow into the changelog and release notes. Security updates for crates such as
# reqwest / tokio / tauri / keyring arrive here.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # JavaScript / TypeScript frontend (pnpm uses the npm ecosystem).
  - package-ecosystem: npm
    directory: "/"
    # Keep dependency work on the development branch even if the repository's
    # default branch is changed accidentally.
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Keep updates reviewable by risk surface. A formatter failure should not
    # block a runtime or security update in the same oversized PR.
    groups:
      sentry:
        patterns:
          - "@sentry/*"
        update-types:
          - minor
          - patch
      tauri:
        patterns:
          - "@tauri-apps/*"
        update-types:
          - minor
          - patch
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
        update-types:
          - minor
          - patch
      vite-vitest:
        patterns:
          - vite
          - "@vitejs/*"
          - vitest
          - "@vitest/*"
        update-types:
          - minor
          - patch
      lint-format:
        patterns:
          - eslint
          - typescript-eslint
          - prettier
          - globals
          - lint-staged
        update-types:
          - minor
          - patch
      webdriverio:
        patterns:
          - webdriverio
          - "@wdio/*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - dependencies

  # Rust workspace. The root manifest owns the workspace-wide Cargo.lock.
  - package-ecosystem: cargo
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies

  # GitHub Actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: main
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies

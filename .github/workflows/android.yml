name: Android

# Cross-compile PROBE for the Tauri Android target.
#
# WHY THIS EXISTS (docs/ANDROID_APP_PLAN.md §5): Android cross-compilation needs
# a reproducible CI environment.
# This job runs the real `tauri android build` in CI to preserve the Android
# cross-compile signal and publish a sideloadable debug APK. The desktop/mobile
# capability split and remote-client surface have landed; the remaining gates
# are physical-device behavior, lifecycle resilience, and release signing.
#
# STATUS — cross-compile probe, NON-BLOCKING. The build currently succeeds and
# uploads a debug APK, but `continue-on-error: true` remains intentional until
# increment 7's physical-device pairing/background/resume matrix is stable. Only
# then should this become a required merge gate.
#
# It triggers narrowly — this workflow file, the Android scaffold, or manual
# dispatch — so it does not add the heavier Android build to every backend PR.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android.yml"
      - "src-tauri/gen/android/**"
      # Dependency/manifest changes are exactly when android-buildability shifts
      # (a new native-C dep can block the cross-compile), so re-run the probe to
      # catch the next blocker. Still non-blocking — it never gates these PRs.
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      # Rust source: during the active Android remote-client build, every src
      # change can affect the cross-compile (new commands, cfg gating, deps used),
      # so verify each one. Narrow this back once the mobile app is stable.
      - "src-tauri/src/**"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android (aarch64 cross-compile probe)
    runs-on: ubuntu-latest
    # NON-BLOCKING until physical-device acceptance is stable (see header); the
    # probe reports regressions without gating a PR.
    continue-on-error: true
    env:
      # Match the NDK the dev box uses; Tauri's Gradle plugin resolves the NDK
      # from NDK_HOME/ANDROID_NDK_ROOT (the app module pins no ndkVersion).
      NDK_VERSION: "27.0.12077973"
      # Sentry build-time env vars. The Gradle plugin reads these automatically:
      #   SENTRY_DSN          — injected into BuildConfig.SENTRY_DSN at compile time.
      #   SENTRY_AUTH_TOKEN   — when absent (contributor/fork builds without the
      #                         secret), the sentry{} block skips symbol upload so the
      #                         probe stays green without a Sentry account.
      #   SENTRY_ORG / SENTRY_PROJECT / SENTRY_URL — identify the upload destination.
      #   SENTRY_ENVIRONMENT  — defaults to "debug" for this non-publishing probe.
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
      SENTRY_ENVIRONMENT: debug
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # AGP 8 / the Tauri Gradle plugin need JDK 17 to run (the app targets Java 8
      # bytecode, but the toolchain itself is 17).
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # compileSdk/targetSdk = 36 (src-tauri/gen/android/app/build.gradle.kts) and
      # the NDK the Rust cross-compile links against.
      - name: Install Android platform + NDK
        run: |
          sdkmanager "platforms;android-36" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # Channel + components come from rust-toolchain.toml.
      - name: Materialize pinned Rust toolchain
        run: rustup show

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The real cross-compile. A DEBUG apk needs no release keystore (signing is
      # owner-only, a later phase). aarch64 alone keeps the build fast.
      # `beforeBuildCommand` (pnpm build) runs the frontend first.
      #
      # As of the rustls switch (#37, dropping the openssl-sys native dep) this
      # SUCCEEDS: the whole app cross-compiles for Android. The job stays
      # non-blocking for now (it is not yet a required check); promote it once the
      # physical-device/background acceptance matrix passes (ANDROID_APP_PLAN §7).
      - name: Android cross-compile (debug apk)
        run: pnpm tauri android build --apk --debug --target aarch64

      # Publish the debug APK so the owner can sideload a real build onto a phone
      # (Settings → install unknown apps). Debug-signed only — not for the Play
      # Store. The exact output path varies by Tauri/Gradle version, so glob it.
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portcode-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: warn

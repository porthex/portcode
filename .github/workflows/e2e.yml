name: E2E

# Build the real Tauri app and inspect its live WebView2 renderer through a
# loopback-only DevTools endpoint. Kept separate from ci.yml because compiling
# Rust and booting a desktop window is heavier than the unit gates.

on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Smoke (Tauri - WebView2)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          # Node 22 provides the stable built-in WebSocket client used for CDP.
          node-version: 22
          cache: pnpm

      - name: Materialize pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check E2E source
        run: pnpm test:e2e:typecheck

      - name: Build debug app
        run: pnpm tauri build --config src-tauri/tauri.e2e.conf.json --debug --no-bundle

      - name: Run E2E smoke test
        run: pnpm test:e2e
        env:
          PORTCODE_E2E_SKIP_BUILD: "1"
